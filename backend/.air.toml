root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/server ./cmd/server"
  bin = "tmp/server"
  full_bin = "APP_ENV=development ./tmp/server"
  include_ext = ["go", "tpl", "tmpl", "html", "env"]
  exclude_dir = ["tmp", "vendor", "testdata"]
  exclude_regex = [".*_test.go"]
  exclude_unchanged = true
  follow_symlink = false
  delay = 100
  stop_on_error = true
  log = "build-errors.log"
  poll = false
  poll_interval = 0

[log]
  main_only = false
  time = true

[color]
  main = "magenta"
  build = "yellow"
  runner = "green"
  watcher = "cyan"

[misc]
  clean_on_exit = true
