# ──────────────────────────────────────────────────────────────────────────────
# nginx.conf untuk FE container (unified Docker architecture, sejak Jul 2026)
#
# Dipakai via volume bind-mount ke /etc/nginx/conf.d/default.conf (override
# default nginx:alpine config). Fungsi utama:
#
#   • Serve static files dari /usr/share/nginx/html (bind-mount ke ./frontend/dist/)
#   • SPA fallback: route non-asset (mis. /admin/users) → /index.html supaya
#     Vue Router / React Router history mode tidak 404 saat direct load.
#   • Cache-header untuk Vite-emitted hashed assets (folder /assets/)
#
# Default nginx:alpine config TIDAK punya try_files fallback — tanpa config ini,
# deep-link ke route SPA akan 404 di production setelah Cloudflare Tunnel route
# ke container ini.
# ──────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html index.htm;

    # gzip — kurangi bandwidth, percepat first-paint di Cloudflare edge
    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1000;

    # Proxy API requests to backend container in Docker network
    location /api/ {
        # 8084 is substituted by run_prod_app at deploy time to match
        # the per-app unique backend port (e.g. 8081, 8082, ...).
        # Default 8080 matches the Go binary's fallback listen port.
        proxy_pass http://backend:8084;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy uploaded files (sparepart images, etc.) to the backend.
    # Backend serves them from /app/uploads (named volume uploads_data).
    location /uploads/ {
        proxy_pass http://backend:8084;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — file konkret (di $uri ATAU $uri/) atau root index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html JANGAN di-cache. Filenya menunjuk ke asset ber-hash yang
    # berubah tiap build; kalau browser/CDN menyajikan index.html lama, user
    # bisa tetap melihat UI versi sebelumnya walaupun deploy sudah selesai.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Cache hashed assets (1 year immutable — Vite emits content-hash filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health-check endpoint untuk Traefik + tools monitoring (kalau ada)
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Default error page (kalau SPA pun 404)
    error_page 500 502 503 504 /50x.html;
}
